<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Certificate - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dash-body">

<header class="dash-header">
  <div class="dash-header-inner">
    <div class="dash-header-top">
      <a href="{{ url_for('admin_dashboard') }}" class="icon-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
      </a>
    </div>
    <p class="dash-welcome">Quick Actions</p>
    <h1 class="dash-role">Issue Certificate</h1>
  </div>
</header>

<main class="dash-main">
  <section class="dash-section">
    <form method="POST" action="{{ url_for('issue_certificate') }}">

      <div class="form-group">
        <label class="form-label" for="student">Student</label>
        <select class="form-input" id="student" name="student" required>
          <option value="">Select a registered student</option>
          <option>Mac Daniel (STU-1042)</option>
          <option>Jan Allan (STU-1043)</option>
          <option>James Aron (STU-1044)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="qualification">Qualification / Degree Name</label>
        <input class="form-input" type="text" id="qualification" name="qualification" placeholder="e.g. Bachelor of Science in Information Technology" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="classification">Classification</label>
        <input class="form-input" type="text" id="classification" name="classification" placeholder="e.g. First Class Honours">
      </div>

      <div class="form-group">
        <label class="form-label" for="issue_date">Issue Date</label>
        <input class="form-input" type="date" id="issue_date" name="issue_date" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="certificate_number">Certificate Number</label>
        <input class="form-input" type="text" id="certificate_number" name="certificate_number" placeholder="Auto-generated on save" readonly>
      </div>

      <div class="form-group">
        <label class="form-label" for="certificate_file">Upload Certificate / Degree File (PDF)</label>
        <input class="form-input" type="file" id="certificate_file" name="certificate_file" accept="application/pdf">
      </div>

      <div class="hash-preview-card">
        <span class="hash-preview-label">SHA-256 Hash Preview</span>
        <span class="hash-preview-value">Will be generated once the form is submitted</span>
      </div>

      <div class="form-btn-row">
        <button type="button" class="btn-secondary">Generate Blockchain Hash</button>
        <button type="submit" class="btn-primary">Issue Certificate</button>
      </div>
    </form>
  </section>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
  <a href="{{ url_for('admin_dashboard') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
    <span>Dashboard</span>
  </a>
  <a href="{{ url_for('admin_students') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/></svg>
    <span>Student</span>
  </a>
  <a href="{{ url_for('admin_certificates') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4"/><path d="M9.7 18.3l-.7 1.7l1.5 -.6l1.5 .6l-.7 -1.7"/><circle cx="11" cy="16" r="2.5"/></svg>
    <span>Certificates</span>
  </a>
  <a href="{{ url_for('admin_profile') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855"/></svg>
    <span>Profile</span>
  </a>
  </div>
</nav>

</body>
</html>
