<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Certificates - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
</head>
<body class="dash-body">

<header class="dash-header">
  <div class="dash-header-inner">
    <div class="dash-header-top">
      <div class="dash-logo-block">
        <div class="dash-logo-badge">
          <img src="{{ url_for('static', filename='logo-icon.png') }}" alt="Academic Credential Verification System logo" width="15" height="15">
        </div>
        <p class="dash-logo-text">Academic Credential<br>Verification System</p>
      </div>
      <p class="dash-header-title">My Certificates</p>
    </div>
    <p class="dash-welcome">Manage</p>
    <h1 class="dash-role">Certificates</h1>
  </div>
</header>

<main class="dash-main">

  <section class="dash-section">
    <a href="{{ url_for('add_student_certificate') }}" class="btn-primary" style="display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; margin-bottom:14px;">
      <i class="ti ti-plus"></i>
      Add Certificate
    </a>

    <div class="cred-list">

      <div class="cred-card">
        <div class="cred-card-header">
          <h3 class="cred-title">Bachelor In Information Technology</h3>
          <button type="button" class="cred-remove-btn" aria-label="Remove certificate" title="Remove">
            <i class="ti ti-trash"></i>
          </button>
        </div>
        <div class="cred-actions">
          <button type="button" class="cred-action-btn">
            <i class="ti ti-eye"></i>
            <span class="cred-action-count">6</span>
            <span>Views</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-cloud-download"></i>
            <span>Download</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-qrcode"></i>
            <span>QR Code</span>
          </button>
        </div>
      </div>

      <div class="cred-card">
        <div class="cred-card-header">
          <h3 class="cred-title">Diploma In Information Technology</h3>
          <button type="button" class="cred-remove-btn" aria-label="Remove certificate" title="Remove">
            <i class="ti ti-trash"></i>
          </button>
        </div>
        <div class="cred-actions">
          <button type="button" class="cred-action-btn">
            <i class="ti ti-eye"></i>
            <span class="cred-action-count">3</span>
            <span>Views</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-cloud-download"></i>
            <span>Download</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-qrcode"></i>
            <span>QR Code</span>
          </button>
        </div>
      </div>

      <div class="cred-card">
        <div class="cred-card-header">
          <h3 class="cred-title">Grade 12 Certificate</h3>
          <button type="button" class="cred-remove-btn" aria-label="Remove certificate" title="Remove">
            <i class="ti ti-trash"></i>
          </button>
        </div>
        <div class="cred-actions">
          <button type="button" class="cred-action-btn">
            <i class="ti ti-eye"></i>
            <span class="cred-action-count">9</span>
            <span>Views</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-cloud-download"></i>
            <span>Download</span>
          </button>
          <button type="button" class="cred-action-btn">
            <i class="ti ti-qrcode"></i>
            <span>QR Code</span>
          </button>
        </div>
      </div>

    </div>
  </section>

</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
  <a href="{{ url_for('student_dashboard') }}" class="bottom-nav-item"><i class="ti ti-home"></i><span>Dashboard</span></a>
  <a href="{{ url_for('student_certificates') }}" class="bottom-nav-item active"><i class="ti ti-file-certificate"></i><span>Certificates</span></a>
  <a href="{{ url_for('student_share') }}" class="bottom-nav-item"><i class="ti ti-share-2"></i><span>Share</span></a>
  <a href="{{ url_for('student_profile') }}" class="bottom-nav-item"><i class="ti ti-user-circle"></i><span>Profile</span></a>
  </div>
</nav>

</body>
</html>
