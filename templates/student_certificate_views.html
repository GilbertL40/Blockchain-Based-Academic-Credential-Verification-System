<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Views - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% include '_pwa_head.html' %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
</head>
<body class="dash-body">

<header class="dash-header">
  <div class="dash-header-inner">
    <div class="dash-header-top">
      <a href="{{ url_for('student_certificates') }}" class="icon-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg>
      </a>
    </div>
    <p class="dash-welcome">{{ cert.course }}</p>
    <h1 class="dash-role">Views</h1>
  </div>
</header>

<main class="dash-main">
  <section class="dash-section">
    {% for record in records %}
    <div class="cert-info-card" style="margin-bottom:10px;">
      <dl class="cert-info-list">
        <div class="cert-info-row"><dt>Viewed By:</dt><dd>{{ record.institution }}</dd></div>
        <div class="cert-info-row"><dt>Date:</dt><dd>{{ record.date }}</dd></div>
        <div class="cert-info-row"><dt>Result:</dt><dd>{{ record.result }}</dd></div>
      </dl>
    </div>
    {% else %}
    <p style="font-size:13px; color:var(--text-muted);">No one has viewed this certificate yet.</p>
    {% endfor %}
  </section>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
  <a href="{{ url_for('student_dashboard') }}" class="bottom-nav-item"><i class="ti ti-home"></i><span>Dashboard</span></a>
  <a href="{{ url_for('student_certificates') }}" class="bottom-nav-item active"><i class="ti ti-file-certificate"></i><span>Certificates</span></a>
  <a href="{{ url_for('student_share') }}" class="bottom-nav-item"><i class="ti ti-share-2"></i><span>Share</span></a>
  <a href="{{ url_for('student_profile') }}" class="bottom-nav-item"><i class="ti ti-user-circle"></i><span>Profile</span></a>
  <a href="{{ url_for('logout') }}" class="bottom-nav-item"><i class="ti ti-logout"></i><span>Logout</span></a>
  </div>
</nav>

</body>
</html>
