<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dash-body">

<header class="dash-header">
  <div class="dash-header-inner">
    <div class="dash-header-top">
      <div class="dash-logo-block">
        <div class="dash-logo-badge">
          <img src="{{ url_for('static', filename='logo-icon.png') }}" alt="logo" width="15" height="15">
        </div>
        <p class="dash-logo-text">Academic Credential<br>Verification System</p>
      </div>
    </div>
    <p class="dash-welcome">Account</p>
    <h1 class="dash-role">My Profile</h1>
  </div>
</header>

<main class="dash-main">

  <section class="dash-section" style="text-align:center;">
    <div class="profile-avatar">{{ admin.initials }}</div>
    <button type="button" class="btn-secondary" style="width:auto; display:inline-block; padding:0.5rem 1.2rem; margin-top:10px;">Change Photo</button>
  </section>

  <section class="dash-section">
    <form method="POST" action="{{ url_for('admin_profile') }}">

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input class="form-input" type="text" id="full_name" name="full_name" value="{{ admin.name }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" name="email" value="{{ admin.email }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input class="form-input" type="tel" id="phone" name="phone" value="{{ admin.phone }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="title">Job Title / Department</label>
        <input class="form-input" type="text" id="title" name="title" value="{{ admin.title }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-input" id="bio" name="bio" rows="4">{{ admin.bio }}</textarea>
      </div>

      <button type="submit" class="btn-primary">Save Profile</button>
    </form>
  </section>

  <section class="dash-section">
    <h2 class="dash-section-title">Account Security</h2>
    <button type="button" class="btn-secondary">Change Password</button>
  </section>

</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
  <a href="{{ url_for('admin_dashboard') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
    <span>Dashboard</span>
  </a>
  <a href="{{ url_for('admin_students') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/></svg>
    <span>Student</span>
  </a>
  <a href="{{ url_for('admin_certificates') }}" class="bottom-nav-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12v-7a2 2 0 0 1 2 -2h7l5 5v4"/><path d="M9.7 18.3l-.7 1.7l1.5 -.6l1.5 .6l-.7 -1.7"/><circle cx="11" cy="16" r="2.5"/></svg>
    <span>Certificates</span>
  </a>
  <a href="{{ url_for('admin_profile') }}" class="bottom-nav-item active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.168 18.849A4 4 0 0 1 10 16h4a4 4 0 0 1 3.834 2.855"/></svg>
    <span>Profile</span>
  </a>
  </div>
</nav>

</body>
</html>
