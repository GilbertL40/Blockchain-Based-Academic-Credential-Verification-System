<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
</head>
<body>

<div class="top-bar"></div>

<i class="ti ti-shield-check bg-icon bg-icon-1" aria-hidden="true"></i>
<i class="ti ti-certificate bg-icon bg-icon-2" aria-hidden="true"></i>
<i class="ti ti-lock bg-icon bg-icon-3" aria-hidden="true"></i>

<div class="login-wrap">
  <div class="login-logo">
<div class="shield">
  <img src="{{ url_for('static', filename='logo-icon.png') }}" alt="Academic Credential Verification System logo" width="48" height="48">
</div>
    <h1>Academic Credential<br>Verification System</h1>
    <p class="tagline">SECURE &bull; TRUSTED &bull; TRANSPARENT</p>
  </div>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="field">
      <input type="email" name="email" placeholder="Email address" required>
    </div>
    <div class="field">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <a href="#" class="forgot-link">Forgot Password?</a>

    <button type="submit" class="btn-login">Login</button>
  </form>
</div>

</body>
</html>
