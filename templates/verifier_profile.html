<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Academic Credential Verification System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
</head>
<body class="dash-body">

<header class="dash-header">
  <div class="dash-header-inner">
    <p class="dash-welcome">Account</p>
    <h1 class="dash-role">My Profile</h1>
  </div>
</header>

<main class="dash-main">

  <section class="dash-section">
    <form method="POST" action="{{ url_for('verifier_profile') }}" enctype="multipart/form-data">

      <div style="text-align:center; margin-bottom:10px;">
        <label for="photo" style="position:relative; display:inline-block; cursor:pointer;">
          {% if verifier.profile_picture %}
          <img class="profile-avatar" src="{{ url_for('static', filename='uploads/' + verifier.profile_picture) }}" alt="Profile photo" style="object-fit:cover;">
          {% else %}
          <div class="profile-avatar">{{ verifier.initials }}</div>
          {% endif %}
          <span style="position:absolute; bottom:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:var(--brand-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; border:2px solid #fff;">+</span>
        </label>
        <input type="file" id="photo" name="photo" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none;">
        {% if photo_error %}
        <p style="color:#c62828; font-size:13px; margin-top:8px;">{{ photo_error }}</p>
        {% endif %}
      </div>

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input class="form-input" type="text" id="full_name" name="full_name" value="{{ verifier.name }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" name="email" value="{{ verifier.email }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input class="form-input" type="tel" id="phone" name="phone" value="{{ verifier.phone }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="organization">Organization</label>
        <input class="form-input" type="text" id="organization" name="organization" value="{{ verifier.organization }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-input" id="bio" name="bio" rows="4">{{ verifier.bio }}</textarea>
      </div>

      <button type="submit" class="btn-primary">Save Profile</button>
    </form>
  </section>

  <section class="dash-section">
    <h2 class="dash-section-title">Account Security</h2>
    <details {{ 'open' if password_success or password_error }}>
      <summary class="btn-secondary" style="cursor:pointer; list-style:none; text-align:center;">Change Password</summary>
      <div style="margin-top:12px;">
        {% if password_success %}
        <p style="color:#2e7d32; font-size:13px; margin-bottom:10px;">{{ password_success }}</p>
        {% endif %}
        {% if password_error %}
        <p style="color:#c62828; font-size:13px; margin-bottom:10px;">{{ password_error }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('verifier_change_password') }}">
          <div class="form-group">
            <label class="form-label" for="current_password">Current Password</label>
            <input class="form-input" type="password" id="current_password" name="current_password" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="new_password">New Password</label>
            <input class="form-input" type="password" id="new_password" name="new_password" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm New Password</label>
            <input class="form-input" type="password" id="confirm_password" name="confirm_password" required minlength="6">
          </div>
          <button type="submit" class="btn-primary">Update Password</button>
        </form>
      </div>
    </details>
  </section>

</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
  <a href="{{ url_for('verifier_dashboard') }}" class="bottom-nav-item"><i class="ti ti-home"></i><span>Home</span></a>
  <a href="{{ url_for('verifier_history') }}" class="bottom-nav-item"><i class="ti ti-clock-hour-4"></i><span>History</span></a>
  <a href="{{ url_for('verifier_share') }}" class="bottom-nav-item"><i class="ti ti-share-2"></i><span>Share</span></a>
  <a href="{{ url_for('verifier_profile') }}" class="bottom-nav-item active"><i class="ti ti-user-circle"></i><span>Profile</span></a>
  <a href="{{ url_for('logout') }}" class="bottom-nav-item"><i class="ti ti-logout"></i><span>Logout</span></a>
  </div>
</nav>

</body>
</html>
